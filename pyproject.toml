[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtl-lymphnet"
version = "0.1.0"
description = "Modular multi-task learning framework for cervical lymph node segmentation and metastasis classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Thahiruddin", email = "muhammad.thahiruddin@ua.ac.id" },
    { name = "Imam Wahyudi", email = "imamwahyudi@ua.ac.id" },
    { name = "Alfie Nuril Musthofa", email = "alfie.nm@ua.ac.id" },
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "segmentation_models_pytorch>=0.3",
    "timm>=0.9",
    "albumentations>=1.4",
    "grad-cam>=1.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tensorboard>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
mtl-lymphnet = "mtl_lymphnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
