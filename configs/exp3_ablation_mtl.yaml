# Experiment 3: Ablation -- MTL (proposed) vs Seg-Only vs Cls-Only.
# The MTL variant is reused from Experiment 1's results (same folds/seed);
# only Seg-Only and Cls-Only are trained fresh here.
mode: full
img_size: 256
backbone: tu-tiny_vit_5m_224.dist_in22k_ft_in1k
pretrained: imagenet

batch_size: 8
num_epochs: 150
lr: 0.0005
weight_decay: 0.0001
use_amp: true
patience: 20
label_smoothing: 0.05
subset_fraction: 1.0

n_folds: 5
val_fraction: 0.2
seed: 42

data_dir: dataset
output_dir: outputs_v2
