# Experiment 4: Ablation -- encoder backbone comparison (R1.4).
# TinyViT-5M (proposed) is reused from Experiment 1; MobileNetV3-Large and EfficientNet-B0
# EfficientNet-B0 are trained fresh with the same protocol.
mode: full
img_size: 256
backbone: tu-tiny_vit_5m_224.dist_in22k_ft_in1k
pretrained: imagenet

batch_size: 8
num_epochs: 150
lr: 0.0005
weight_decay: 0.0001
use_amp: true
patience: 20
label_smoothing: 0.05
subset_fraction: 1.0

n_folds: 5
val_fraction: 0.2
seed: 42

data_dir: dataset
output_dir: outputs_v2

loss_strategy: uncertainty
w_seg: 0.5
